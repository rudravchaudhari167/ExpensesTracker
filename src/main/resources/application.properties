spring.application.name=expense-tracker

# Server Port Configuration
# Dynamic port support for cloud hosts (e.g. Vercel, Render, Railway bind to $PORT) and local development (8080)
server.port=${PORT:8080}

# Database connection
# Supports dynamic cloud database environments (Render, Railway, PlanetScale, AWS RDS) or local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:expense_tracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:Rajpatil@1408}}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

